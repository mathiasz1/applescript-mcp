name: FamilyApp

# Generate the Xcode project with XcodeGen:
#   brew install xcodegen
#   cd FamilyApp && xcodegen generate
# The resulting FamilyApp.xcodeproj is git-ignored and recreated from this file.

options:
  bundleIdPrefix: com.mathiasz1.familyapp
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    # iPad only
    TARGETED_DEVICE_FAMILY: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  FamilyApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathiasz1.familyapp
        INFOPLIST_FILE: Sources/FamilyApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MAC_CATALYST: NO
        UISupportedInterfaceOrientations: ""
    info:
      path: Sources/FamilyApp/Resources/Info.plist

  FamilyAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/FamilyAppTests
    dependencies:
      - target: FamilyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathiasz1.familyapp.tests

  FamilyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests/FamilyAppUITests
    dependencies:
      - target: FamilyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathiasz1.familyapp.uitests

schemes:
  FamilyApp:
    build:
      targets:
        FamilyApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FamilyAppTests
        - FamilyAppUITests
